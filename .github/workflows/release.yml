# GERADO pelo create-project — NÃO editar à mão (regenere via plataforma).
# Release no merge na `main`: release-please calcula a versão (prioridade dos Conventional
# Commits), bumpa o arquivo de versão (node) e cria tag + changelog; ao sair um
# release, PUBLICA o artefato (bundle estático no bucket+CDN) na cloud aws.
# Fluxo completo: docs/ci-cd.md do orquestrador.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          release-type: node
          # token: ${{ secrets.RELEASE_PLEASE_TOKEN }}  # PAT p/ o release disparar outros workflows

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - name: cache do SonarScanner (plugins/analyzers — evita re-download a cada análise)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
      - name: SonarQube scan (quality — lê configs/sonar-project.properties)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          # O properties mora em configs/; a action só o descobre na raiz. projectBaseDir vai junto,
          # senão a base da análise viraria configs/ e o scan varreria só aquela pasta.
          args: -Dproject.settings=configs/sonar-project.properties -Dsonar.projectBaseDir=.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: gate de cobertura (minCoverage=0, fixado no create)
        run: |
          MIN=0
          if [ "$MIN" -eq 0 ]; then echo "gate desligado (minCoverage 0)"; exit 0; fi
          COV=$(node -e "console.log(Math.floor((require('./coverage/coverage-summary.json').total.lines.pct)||0))")
          echo "cobertura $COV% (mínimo $MIN%)"
          [ "$COV" -ge "$MIN" ] || { echo "::error::cobertura $COV% < $MIN% — bloqueia release/prod"; exit 1; }
  publish:
    needs: [release, test]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - name: build do bundle
        run: npm ci && npm run build   # gera ./dist (ajuste se o output for outro)
      - name: sync p/ S3 (versão + latest)
        run: |
          aws s3 sync dist "s3://${{ vars.AWS_STATIC_BUCKET }}/fe-cep-painel/$VERSION/" --delete
          aws s3 sync dist "s3://${{ vars.AWS_STATIC_BUCKET }}/fe-cep-painel/latest/" --delete
