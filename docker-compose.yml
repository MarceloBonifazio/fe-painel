# Compose STANDALONE do `fe-cep-painel` (spa · node/angular) — GERADO.
#
#   docker compose up            ← na raiz DESTE repo, sem a plataforma
#
# Sobe o workload com o domínio dele e mais nada: Vault · floci-aws (cloud local).
#
# QUEM MANDA QUANDO: a plataforma NÃO lê este arquivo. Lá o compose é
# `docker-compose.base.yml` + `service.yml` (ver compose.gen.mjs), e é o da plataforma que vale —
# os dois nunca são carregados juntos, então não há merge nem conflito. Rodando pela plataforma o
# workload ganha Traefik, observabilidade e os emuladores compartilhados; aqui ganha só o essencial.
#
# O que muda em relação ao `service.yml` (e por quê):
#   • sem Traefik → a porta sai publicada no host (http://localhost:3000), em vez de rota no proxy
#   • sem Prometheus/Grafana/Loki → o /metrics continua exposto, só não há quem raspe
#   • rede própria deste projeto, em vez da rede compartilhada `platform`
#   • Vault semeado aqui mesmo (a plataforma semeia a partir do platform.yaml, que não existe aqui)
#   • um emulador só (floci-aws), não os três da base
# `name:` fixa o nome do projeto compose → containers/rede próprios, sem colidir com a plataforma.
name: fe-cep-painel

services:
  fe-cep-painel:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      # Publicado direto: sem Traefik na frente, este é o acesso ao workload.
      - "3000:3000"
      - "3000:3000"      # listener gRPC (h2c)
    environment:
      PORT: "3000"
      # Sem Traefik não há prefixo de rota: o dev server serve na raiz.
      BASE_PATH: "/"
      APP_ENV: development
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHFILES_FORCE_POLLING: "true"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN:-dev-root-token}"
      VAULT_SECRET_PATH: "secret/data/fe-cep-painel/dev"
      AWS_ENDPOINT_URL: "http://floci-aws:4566"
      AWS_REGION: "${AWS_REGION:-sa-east-1}"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
    volumes:
      # `.` e não ./projects/<name>: aqui a raiz do compose é a raiz do próprio workload.
      - .:/app
      - /app/node_modules
    depends_on:
      vault-seed: { condition: service_completed_successfully }


  # Vault em modo dev (in-memory: zera a cada restart, e o seed abaixo repõe).
  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"

  # Semeia secret/fe-cep-painel/dev com os placeholders do contrato (PORT + APP_ENV) — o MESMO conteúdo que
  # o seed da plataforma grava. Roda uma vez e sai; o app espera a conclusão (depends_on acima) para
  # não subir antes do namespace existir. Troque pelos segredos reais do workload.
  vault-seed:
    image: hashicorp/vault:1.18
    depends_on: [vault]
    restart: "no"
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-root-token}
    entrypoint:
      - sh
      - -c
      - |
        i=0
        until vault status >/dev/null 2>&1; do
          i=$$((i + 1))
          [ "$$i" -gt 60 ] && { echo "[vault-seed] vault não subiu em 60s" >&2; exit 1; }
          sleep 1
        done
        vault kv get secret/fe-cep-painel/dev >/dev/null 2>&1 \
          || vault kv put secret/fe-cep-painel/dev PORT="3000" APP_ENV=development >/dev/null
        echo "[vault-seed] secret/fe-cep-painel/dev pronto"

  # Cloud local do workload (aws). Não é LocalStack: cada cloud tem binário e porta próprios,
  # e o emulador roda todos os serviços dela. Os recursos que o workload declara são criados pelo
  # `make create` na plataforma — em standalone, crie-os pelo SDK/CLI apontando p/ este endpoint.
  floci-aws:
    image: floci/floci:latest       # :4566
    restart: unless-stopped
