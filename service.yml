# Fragmento de compose do `fe-cep-painel` (spa · node/angular) — DEV. GERADO.
# Auto-registro no Traefik via labels.
# Composto com a base por `compose.gen.mjs` (make up). Rede `platform` vem da base.
services:
  fe-cep-painel:
    build:
      context: ./projects/fe-cep-painel
      # UM Dockerfile, dois targets. O de prod está no service.prod.yml, que sobrepõe este bloco.
      # Eram dois arquivos que divergiam em silêncio — correção num não chegava no outro.
      dockerfile: Dockerfile
      target: dev
    # `no` para quem TERMINA (batch/cron): o processo sai ao concluir, e `unless-stopped` o
    # reiniciaria em laço. Em dev não há agendador — o container roda uma vez no `make up`.
    restart: unless-stopped
    environment:
      PORT: "3000"
      # Frontend servido sob /painel/ — o dev server usa este base p/ os assets baterem.
      BASE_PATH: "/painel/"
      APP_ENV: development
      NODE_ENV: development
      # Hot-reload sobre bind-mount (polling — robusto no Docker Desktop/macOS).
      CHOKIDAR_USEPOLLING: "true"
      WATCHFILES_FORCE_POLLING: "true"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      # Segredos: namespace dedicado no Vault (secret/fe-cep-painel/dev).
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "${VAULT_TOKEN:-dev-root-token}"
      VAULT_SECRET_PATH: "secret/data/fe-cep-painel/dev"
      # Cloud local: floci-aws (imagem/porta próprias por cloud). "Tudo via floci" em dev.
      # Envs específicas da cloud: AWS SDK · Azure connection string · GCP emulator hosts.
      AWS_ENDPOINT_URL: "http://floci-aws:4566"
      AWS_REGION: "${AWS_REGION:-sa-east-1}"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"

    volumes:
      - ./projects/fe-cep-painel:/app          # hot-reload (bind-mount do source)
      - /app/node_modules                 # preserva deps/artefatos da imagem
    networks: [platform]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=platform"
      # frontend → http://localhost:8088/painel (sem strip; servido com base /painel/)
      - "traefik.http.routers.fe-cep-painel.rule=PathPrefix(`/painel`)"
      - "traefik.http.routers.fe-cep-painel.entrypoints=web"
      - "traefik.http.services.fe-cep-painel.loadbalancer.server.port=3000"

  # Dashboard + alertas/SLOs do workload no Grafana (provisionados a partir do REPO do workload:
  # projects/fe-cep-painel/observability/). Merge no service `grafana` da base → o provider "workloads"
  # carrega o dashboard como folder "fe-cep-painel" (recarrega ao editar, 10s); o alerts.yaml entra no
  # unified-alerting provisioning como regras na folder "workloads".
  grafana:
    volumes:
      - ./projects/fe-cep-painel/observability:/workload-dashboards/fe-cep-painel:ro
      - ./projects/fe-cep-painel/observability/alerts.yaml:/etc/grafana/provisioning/alerting/fe-cep-painel.yaml:ro
